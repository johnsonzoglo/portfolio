<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111510">
  <title>Invoice — JZ Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#171b16;--muted:#71786e;--line:#dfe3dc;--paper:#fff;--green:#c8fa57;--mono:"DM Mono",monospace;--sans:"Manrope",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#eef0eb;color:var(--ink);font:13px var(--sans);-webkit-font-smoothing:antialiased}.invoice-toolbar{min-height:72px;padding:0 max(20px,calc((100% - 920px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;background:#111510;color:#fff}.invoice-toolbar>a{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-size:10px}.invoice-toolbar>a span{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--green);color:#172011;font-weight:900}.invoice-toolbar div{display:flex;gap:8px}.invoice-toolbar button,.invoice-toolbar a:last-child{min-height:38px;padding:0 13px;border:1px solid #333a31;border-radius:7px;background:#1b2119;color:#fff;font:500 9px var(--sans);cursor:pointer}.invoice-toolbar button{background:var(--green);border-color:var(--green);color:#172011;font-weight:800}.invoice-shell{width:min(920px,calc(100% - 32px));margin:32px auto 70px}.invoice{min-height:760px;padding:55px 60px;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 22px 60px rgba(23,28,20,.1)}.invoice-loading{height:600px;display:grid;place-items:center;color:var(--muted)}.top,.row,.total{display:flex;justify-content:space-between;gap:30px}.top{padding-bottom:35px;border-bottom:3px solid #171b16}.brand{font-size:29px;font-weight:900;letter-spacing:-.06em}.brand span{color:#6a922c}.top p{margin:7px 0 0;color:var(--muted);font-size:9px}.meta{text-align:right}.meta b{font:600 12px var(--mono)}.meta p{font-size:8px}.customer{margin:42px 0;padding:20px;border:1px solid var(--line);border-radius:9px;background:#f8faf6;line-height:1.75}.customer>b{display:block;margin-bottom:8px;font:500 8px var(--mono);letter-spacing:.08em;text-transform:uppercase}.items{border-top:1px solid #aeb4aa}.row{padding:15px 4px;border-bottom:1px solid var(--line)}.row span{color:#4f564c}.totals{width:min(390px,100%);margin:30px 0 0 auto}.total{padding:9px 4px;color:#61685e}.total b{color:#20251e}.total.grand{margin-top:8px;padding:17px 4px;border-top:2px solid #171b16;color:#171b16;font-size:18px;font-weight:800}.invoice-footer{margin-top:75px;padding-top:20px;display:flex;justify-content:space-between;gap:25px;border-top:1px solid var(--line);color:#81887e;font:500 8px var(--mono);text-transform:uppercase}@media(max-width:650px){.invoice-toolbar{padding:12px 16px}.invoice-toolbar>a:last-child{display:none}.invoice-shell{width:min(100% - 20px,920px);margin-top:12px}.invoice{padding:30px 22px;border-radius:10px}.top{align-items:flex-start;flex-direction:column}.meta{text-align:left}.customer{margin:30px 0}.row{gap:15px}.invoice-footer{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff}.invoice-toolbar{display:none}.invoice-shell{width:100%;margin:0}.invoice{min-height:0;padding:30px;border:0;border-radius:0;box-shadow:none}@page{margin:12mm}}
  </style>
</head>
<body>
  <header class="invoice-toolbar">
    <a href="admin.html"><span>JZ</span><strong>Market invoice</strong></a>
    <div><a href="admin.html">Back to orders</a><button type="button" onclick="print()">Print / Save PDF</button></div>
  </header>
  <main class="invoice-shell">
    <article class="invoice" id="invoice"><div class="invoice-loading">Preparing invoice…</div></article>
  </main>
  <script src="invoice.js"></script>
</body>
</html>
